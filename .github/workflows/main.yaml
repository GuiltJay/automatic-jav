name: Main Scraper

on:
  schedule:
    - cron: "0 10 * * *" # 5:30 PM IST
  workflow_dispatch:

concurrency:
  group: scraper-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      # Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: scraper-pipeline
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run all pipelines
      - name: Run all pipelines in one container
        run: |
          mkdir -p docs results

          docker run --rm \
            -v "${{ github.workspace }}/docs:/app/docs" \
            -v "${{ github.workspace }}/results:/app/results" \
            scraper-pipeline \
            bash -lc "./run_pipeline.sh && ./missav_pipeline.sh && ./onejav_pipeline.sh && ./javct_pipeline.sh && ./aggregator_pipeline.sh"

      # Show outputs
      - name: Show outputs
        run: |
          echo "===== docs ====="
          ls -lah docs || true
          echo "===== results ====="
          ls -lah results || true

      # Archive raw snapshots
      - name: Archive raw snapshots
        uses: ./.github/actions/archive-raw

      # Commit generated files
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs results

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update scraper results ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin HEAD:main
          fi

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          keep_files: false
