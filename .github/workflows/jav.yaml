name: Jav Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # -------------------------
      # Build Docker image
      # -------------------------
      - name: Build Docker image
        run: |
          docker build -t javguru-pipeline .

      # -------------------------
      # Run pipeline container
      # -------------------------
      - name: Run pipeline
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/docs:/app/docs" \
            -v "${GITHUB_WORKSPACE}/results:/app/results" \
            javguru-pipeline

      # -------------------------
      # Build Astro Static Frontend
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Build Astro Static Site
        run: |
          cd app
          npm ci
          npm run build

      # -------------------------
      # Debug
      # -------------------------
      - name: Show results
        run: |
          ls -la docs || true
          ls -la results || true

      # -------------------------
      # Commit results
      # -------------------------
      - name: Commit generated files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs results

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "chore(data): update results ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin main
            echo "✅ Data committed"
          fi

      # -------------------------
      # Publish Pages
      # -------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          keep_files: false
