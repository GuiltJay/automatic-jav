name: Jav Scraper

on:
  workflow_dispatch:

concurrency:
  group: scraper-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------
      # Build Docker image
      # -------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: javguru-pipeline
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------
      # Run pipeline container
      # -------------------------
      - name: Run pipeline
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/docs:/app/docs" \
            -v "${GITHUB_WORKSPACE}/results:/app/results" \
            javguru-pipeline

      # -------------------------
      # Debug
      # -------------------------
      - name: Show results
        run: |
          tree docs || true
          tree results || true

      - name: Archive raw snapshots
        uses: ./.github/actions/archive-raw

      # -------------------------
      # Commit results
      # -------------------------
      - name: Commit generated files (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/*.html results/**/*.csv || true

          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update results ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin main
            echo "✅ Data committed"
          else
            echo "ℹ️ No changes to commit"
          fi

      # -------------------------
      # Publish Pages
      # -------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          keep_files: false
